<div class="import-overlay" id="shareOverlay" style="display: none">
  <div class="import-card share-card">
    <div class="import-header">
      <span class="import-title">Share photos</span>
      <button
        class="import-close-btn"
        id="shareOverlayCloseBtn"
        aria-label="Close"
        type="button"
      >
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <div class="import-progress-section" id="shareOverlayChecking" hidden>
      <p class="share-overlay-lead" id="shareOverlayCheckingLead">
        Checking selected photos for sharing…
      </p>
    </div>

    <div class="import-progress-section" id="shareOverlayPreflight" hidden>
      <p class="share-overlay-lead" id="shareOverlayLead"></p>
      <p class="share-overlay-consent" id="shareOverlayConsent">
        Anyone with this link can view and download the photos.
      </p>
      <button
        type="button"
        class="share-title-link"
        id="shareOverlayTitleToggle"
        aria-pressed="false"
      >
        Add a title
      </button>
      <input
        type="text"
        class="share-title-input"
        id="shareOverlayTitleInput"
        hidden
      />
    </div>

    <div class="import-progress-section" id="shareOverlayOversize" hidden>
      <p class="share-overlay-lead" id="shareOverlayOversizeLead"></p>
    </div>

    <div
      class="import-details-section"
      id="shareOverlayDetailsSection"
      style="display: none"
    >
      <button
        class="import-details-toggle"
        id="shareOverlayDetailsToggle"
        type="button"
      >
        <span class="material-symbols-outlined">expand_more</span>
        <span>Show details</span>
      </button>
      <div
        class="import-details-list"
        id="shareOverlayDetailsList"
        style="display: none"
      ></div>
    </div>

    <div class="import-progress-section" id="shareOverlayComplete" hidden>
      <p class="share-overlay-lead" id="shareOverlayCompleteMessage"></p>
      <div class="share-url-row">
        <code class="share-url-text" id="shareOverlayCompleteUrl"></code>
        <button class="btn btn-secondary share-copy-btn" id="shareOverlayCopyBtn" type="button">
          Copy
        </button>
      </div>
    </div>

    <div class="import-progress-section" id="shareOverlayProgress" hidden>
      <p class="share-overlay-lead" id="shareOverlayProgressText">Uploading…</p>
      <p class="share-overlay-remaining" id="shareOverlayProgressRemaining"></p>
    </div>

    <div class="import-progress-section" id="shareOverlayFailed" hidden>
      <p class="share-overlay-lead" id="shareOverlayFailedMessage"></p>
    </div>

    <div class="import-actions" id="shareOverlayActions">
      <button
        class="btn btn-secondary"
        id="shareOverlayCancelBtn"
        type="button"
      >
        Cancel
      </button>
      <button class="btn btn-primary" id="shareOverlayShareBtn" type="button">
        Share
      </button>
      <button
        class="btn btn-primary"
        id="shareOverlaySkipBtn"
        type="button"
        hidden
      >
        Skip
      </button>
      <button
        class="btn btn-primary"
        id="shareOverlayRetryBtn"
        type="button"
        hidden
      >
        Retry
      </button>
      <button
        class="btn btn-primary"
        id="shareOverlayDoneBtn"
        type="button"
        hidden
      >
        Done
      </button>
    </div>
  </div>
</div>
