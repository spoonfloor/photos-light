<!-- App Bar Shell — shared by app and share (build-share-viewer.sh reads
     this file directly). Per-surface differences are data-cap gates,
     resolved by ViewCapabilities.get() + chrome.js's [data-cap] loop —
     not a second copy of this fragment.

     data-cap items that are OFF for some surface ship `hidden` so the
     pre-JS html-first shell never flashes them where they don't belong
     (share must not show add/edit/delete). chrome.js un-hides the ones
     the active surface's caps enable — same mechanism the date-picker
     and #restoreBtn below already rely on. -->
<div class="app-bar-wrapper no-select">
  <div class="app-bar-elements-layer">
    <div class="title-and-back">
      <span
        class="title title-photos"
        id="appBarTitle"
        data-title-short="P/Light"
        >Photos Light</span
      >
    </div>

    <div class="date-picker" data-cap="dateJumper" hidden aria-hidden="true">
      <span class="date-picker-label">Month</span>
      <select id="monthPicker" class="date-picker-select">
        <!-- Populated by JS -->
      </select>

      <span class="date-picker-label">Year</span>
      <select id="yearPicker" class="date-picker-select">
        <!-- Populated by JS -->
      </select>
    </div>

    <div class="actions">
      <button
        type="button"
        class="app-bar-icon-button"
        id="sortToggleBtn"
        aria-label="Sort"
        title="Newest first"
      >
        <span class="material-symbols-outlined app-bar-icon" id="sortIcon"
          >hourglass_arrow_down</span
        >
      </button>

      <button
        type="button"
        class="app-bar-icon-button"
        id="addPhotoBtn"
        aria-label="Add Photo"
        title="Add photo"
        data-cap="import"
        hidden
      >
        <span class="material-symbols-outlined app-bar-icon">add_a_photo</span>
      </button>

      <button
        type="button"
        class="app-bar-icon-button inactive"
        id="downloadBtn"
        aria-label="Download"
        title="Download"
        data-cap="downloadInAppBar"
      >
        <span class="material-symbols-outlined app-bar-icon">download</span>
      </button>

      <button
        type="button"
        class="app-bar-icon-button inactive"
        id="deselectAllBtn"
        aria-label="Deselect all"
        title="Deselect all"
      >
        <span class="material-symbols-outlined app-bar-icon">cancel</span>
      </button>

      <button
        type="button"
        class="app-bar-icon-button"
        id="editDateBtn"
        aria-label="Edit Date"
        title="Change date"
        data-cap="editDate"
        hidden
      >
        <span class="material-symbols-outlined app-bar-icon">edit_calendar</span>
      </button>

      <button
        type="button"
        class="app-bar-icon-button"
        id="restoreBtn"
        aria-label="Restore selected"
        title="Restore selected"
        data-cap="restore"
        hidden
      >
        <span class="material-symbols-outlined app-bar-icon">undo</span>
      </button>

      <button
        type="button"
        class="app-bar-icon-button"
        id="deleteBtn"
        aria-label="Delete"
        title="Delete selected"
        data-cap="deleteKind"
        hidden
      >
        <span class="material-symbols-outlined app-bar-icon">delete</span>
      </button>

      <button
        type="button"
        class="app-bar-icon-button"
        id="utilitiesBtn"
        aria-label="More options"
        title="More options"
      >
        <span class="material-symbols-outlined app-bar-icon">more_vert</span>
      </button>
    </div>
  </div>
</div>
